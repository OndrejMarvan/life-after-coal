/* Layout: one centered column. Title strip, stat row, the mine canvas with overlays on top, touch pad, help line.
   Single committed look: a lamp-lit underground in warm black, ember for action, gold for money, ice for the surface. */
:root {
  --bg: #120f0d;
  --panel: #1d1815;
  --panel-2: #29221d;
  --line: #3b322b;
  --fg: #efe6d8;
  --muted: #a89c8d;
  --ember: #ee8a3c;
  --gold: #e8bf50;
  --ice: #93b8cd;
  --blood: #c9492f;
  --good: #7cc27f;
  --display: 'Oswald', 'Arial Narrow', Impact, sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--fg);
  font: 15px/1.45 var(--body);
  padding-block: 16px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
.game { max-width: 760px; margin: 0 auto; display: grid; gap: 12px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top h1 { margin: 0; font: 700 clamp(22px, 5vw, 30px)/1.1 var(--display); letter-spacing: .06em; text-transform: uppercase; text-wrap: balance; }
.top h1 span { color: var(--ember); }
.top .meta { display: flex; align-items: center; gap: 10px; min-width: 0; }
.rank { font: 500 13px var(--display); letter-spacing: .08em; color: var(--ice); }
.icon-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--muted); }
.icon-btn:hover { color: var(--fg); border-color: var(--muted); }

.hud { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.stat .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stat .v { font: 600 19px/1.2 var(--body); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v small { font-size: 12px; color: var(--muted); font-weight: 500; }
.stat.cash .v { color: var(--gold); }
.bar { height: 5px; border-radius: 3px; background: #0c0a09; margin-top: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--good); transition: width .1s linear; }
.bar.warn i { background: var(--blood); }
.bar.pack i { background: var(--ice); }
.bar.pack.full i { background: var(--ember); }

.stage { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #0b0908; }
canvas { display: block; width: 100%; height: auto; aspect-ratio: 640 / 520; image-rendering: pixelated; touch-action: none; }
.toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: 92%; background: rgba(18,15,13,.92); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font-size: 13px; text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.toast.bad { border-color: var(--blood); color: #ffb7a6; }
.toast.good { border-color: var(--gold); color: var(--gold); }
.prompt { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--ember); color: #1a0f07; border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
/* in the museum the hall is at the bottom of the view, so the prompt moves up onto the rock */
.prompt.raised { bottom: auto; top: 30%; }
.prompt kbd { background: rgba(0,0,0,.2); border-radius: 4px; padding: 1px 6px; margin-right: 6px; font: 600 12px var(--body); }

.overlay { position: absolute; inset: 0; background: rgba(12,10,9,.88); overflow-y: auto; display: flex; padding: 16px; }
.overlay[hidden] { display: none; }
.card { margin: auto; width: 100%; max-width: 520px; }
.card h2 { margin: 0 0 4px; font: 700 clamp(22px, 5vw, 30px)/1.15 var(--display); letter-spacing: .05em; text-wrap: balance; }
.card p { margin: 0 0 12px; color: var(--muted); }
.card .pass { color: var(--gold); font-size: 13px; }
.card .tag { color: var(--ice); font: 500 13px var(--display); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px; }
.field { display: grid; gap: 4px; margin: 14px 0; }
.field label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.field input { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; color: var(--fg); font: 500 16px var(--body); width: 100%; }
.field input:focus-visible, button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.btn { background: var(--ember); color: #1a0f07; border: 0; border-radius: 6px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.btn.ghost:hover { color: var(--fg); border-color: var(--muted); }
.btn:disabled { opacity: .35; cursor: not-allowed; filter: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.shop { width: 100%; max-width: 600px; margin: 0 auto; }
.shop-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.shop-head h2 { margin: 0; font: 700 22px var(--display); letter-spacing: .06em; }
.shop-head .cash { font: 600 20px var(--body); color: var(--gold); font-variant-numeric: tabular-nums; }
.sect { margin: 14px 0 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.cargo { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
.cargo ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
.cargo li { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.up { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 9px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
.up b { font-weight: 600; }
.up .d { font-size: 13px; color: var(--muted); grid-column: 1; min-width: 0; }
.up .btn { grid-column: 2; grid-row: 1 / span 2; padding: 8px 12px; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.up.throne { border-color: var(--gold); }
.up.throne b { color: var(--gold); font-family: var(--display); letter-spacing: .05em; }

.pad { display: none; gap: 12px; align-items: center; justify-content: space-between; }
.dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
.dpad button, .acts button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; font-size: 20px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
.dpad button:active, .acts button:active { background: var(--ember); color: #1a0f07; }
.dpad .u { grid-area: 1 / 2; } .dpad .l { grid-area: 2 / 1; } .dpad .r { grid-area: 2 / 3; } .dpad .d { grid-area: 3 / 2; }
.acts { display: grid; gap: 8px; }
.acts button { padding: 14px 22px; font-size: 15px; font-weight: 600; }
@media (hover: none), (max-width: 700px) { .pad { display: flex; } }
/* Phones: everything (stats, mine, controls) has to fit one screen without scrolling. */
@media (max-width: 560px) {
  body { padding-block: 6px 10px; }
  .game { gap: 8px; }
  .top { gap: 4px 10px; }
  .top h1 { font-size: 20px; }
  .top .meta { gap: 6px; }
  .rank { font-size: 12px; }
  .icon-btn { padding: 3px 8px; font-size: 12px; }
  .hud { grid-template-columns: 1.15fr 1.45fr 1fr 1fr 1fr; gap: 5px; }
  .stat { padding: 4px 6px; border-radius: 6px; }
  .stat .k { font-size: 9px; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* the bars already show "out of how many", so the "/ max" and "best" parts go */
  .stat .k [data-i="drains"], .stat .v small { display: none; }
  .stat .v { font-size: 14px; }
  /* start screen, shop and ending take the whole screen instead of the small mine window */
  .overlay { position: fixed; z-index: 10; background: rgba(12,10,9,.97); }
  .bar { height: 4px; margin-top: 3px; }
  .dpad { grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); }
  .acts button { padding: 12px 16px; }
}
/* The keyboard help means nothing on a touch screen. */
@media (hover: none) { .help { display: none; } }

.help { margin: 0; font-size: 13px; color: var(--muted); }
.help kbd { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: 500 12px var(--body); color: var(--fg); }
@media (prefers-reduced-motion: reduce) { .toast, .bar i { transition: none; } }
</style>

<main class="game">
  <header class="top">
    <h1 data-i="h1">Last <span>Shift</span></h1>
    <div class="meta">
      <span class="rank" id="rank"></span>
      <button class="icon-btn" id="restart" type="button" data-i="restart">Restart</button>
      <button class="icon-btn" id="mute" type="button" data-ia="soundAria" aria-label="Toggle sound">Sound on</button>
    </div>
  </header>

  <section class="hud" data-ia="status" aria-label="Status">
    <div class="stat"><div class="k" data-i="depth">Depth</div><div class="v"><span id="depth">0</span> m <small><span data-i="best">best</span> <span id="best">0</span></small></div></div>
    <div class="stat cash"><div class="k" data-i="gold">Pay</div><div class="v" id="cash">$0</div></div>
    <div class="stat"><div class="k" data-i="pack">Load</div><div class="v"><span id="pack">0</span><small> / <span id="cap">12</span></small></div><div class="bar pack" id="packbar"><i></i></div></div>
    <div class="stat"><div class="k"><span data-i="stamina">Strength</span> <span style="text-transform:none;letter-spacing:0" data-i="drains">(drains underground)</span></div><div class="v"><span id="sta">60</span><small> / <span id="stamax">60</span></small></div><div class="bar" id="stabar"><i></i></div></div>
    <div class="stat"><div class="k" data-i="ravens">Cage rides</div><div class="v" id="ravens">0</div></div>
  </section>

  <div class="stage" id="stage">
    <canvas id="c" width="640" height="520" data-ia="mine" aria-label="The mine"></canvas>
    <div class="toast" id="toast" role="status"></div>
    <button class="prompt" id="prompt" type="button" hidden></button>

    <div class="overlay" id="start">
      <div class="card">
        <div class="tag" data-i="tagStart">Glück auf!</div>
        <h2 data-i="startH">Go deeper than any other miner.</h2>
        <p data-i="startP"></p>
        <div class="field"><label for="house" data-i="nameHouse">Your miner’s name</label><input id="house" maxlength="18" value="" autocomplete="off"></div>
        <div class="row">
          <button class="btn" id="begin" type="button" data-i="begin">Start the shift</button>
          <button class="btn ghost" id="erase" type="button" hidden data-i="erase">Erase progress</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="shop" hidden></div>
    <div class="overlay" id="info" hidden></div>

    <div class="overlay" id="end" hidden>
      <div class="card">
        <div class="tag" data-i="tagEnd">Shift’s over</div>
        <h2 id="endTitle"></h2>
        <p id="endText"></p>
        <div class="row"><button class="btn" id="keep" type="button" data-i="keep">Keep digging</button></div>
      </div>
    </div>
  </div>

  <div class="pad" data-ia="touch" aria-label="Touch controls">
    <div class="dpad">
      <button class="u" data-dir="up" data-ia="up" aria-label="Up">&#9650;</button>
      <button class="l" data-dir="left" data-ia="left" aria-label="Left">&#9664;</button>
      <button class="r" data-dir="right" data-ia="right" aria-label="Right">&#9654;</button>
      <button class="d" data-dir="down" data-ia="down" aria-label="Down">&#9660;</button>
    </div>
    <div class="acts">
      <button id="tShop" type="button" data-i="use">Use</button>
      <button id="tRaven" type="button" data-i="raven">Cage</button>
    </div>
  </div>

  <p class="help" data-i="help"></p>
</main>

<script>
(() => {
'use strict';

/* ---------- language ----------
   A Silesian pit: the Miners' Hall (cechovna / cechownia) at the pithead, the cage (klec / szola) that
   brings you up, burning seams, gifts from the mine spirit (Permoník / Skarbnik), and the old mine to buy
   and give a life after coal. Czech and Polish texts avoid gendered past tenses on purpose. */

const ARROWS = '<kbd>&#8592;</kbd><kbd>&#8593;</kbd><kbd>&#8595;</kbd><kbd>&#8594;</kbd>';
const I18N = {

    tagEnd: 'Shift’s over', keep: 'Keep digging',
    help: ARROWS + ' or <kbd>WASD</kbd> walk and dig. Hold a direction to tunnel. <kbd>E</kbd> trades at the Miners’ Hall on the surface. Strength drains every second you spend underground, and faster when you dig. It comes back on the surface. If it hits zero you black out and lose your whole load. <kbd>R</kbd> rings for the cage to bring you up with your load. <kbd>M</kbd> mutes.',
    ores: ['Coal', 'Zinc ore', 'Iron ore', 'Silver', 'Gold', 'Garnet', 'Diamond', 'Amethyst', 'Skarbnik’s gem'],

      sta: v => v + ' strength',
      lamp: v => v.toLocaleString('en-GB') + ' tiles of light',
      boots: v => Math.round(1 / v) + ' steps per second',
    },
    ranks: ['Apprentice', 'Miner', 'Face foreman', 'Overman', 'Mine captain', 'Mine director'],
    packFull: 'Load full', chest: 'Gift! +', gift: m => 'Skarbnik, the spirit of the mine, left you ' + m + '.',
    collapsed: n => 'You blacked out from exhaustion. ' + (n ? 'Your whole load (' + n + ' ore) is lost.' : 'Your load was empty.'),
    home: 'You are already on the surface.', noRides: 'No cage rides left. The Miners’ Hall sells them.', rideHome: 'The cage brought you up with your load.',
    fire: 'Fire! -25', fireHint: 'A burning seam. Dig around it.', bedrock: 'Bedrock. The coal basin ends here.',
    hallWhere: 'The Miners’ Hall is on the surface, on the left.', hint: 'Step off the snow and dig down. Your lamp shows the ore.',
    haul: 'Your load', nothing: 'Nothing yet. Dig down and bring something up.', sellAll: 'Sell all', sellFor: m => ' for ' + m,
    gear: 'Gear', maxed: 'Fully upgraded.', rideName: 'Cage ride', rideHold: n => 'you hold ' + n, rideDesc: 'Press R underground to ride up with your whole load.',
    goal: 'The big goal', mineName: 'The old mine', mineOwned: h => h + ' already owns it.',
    mineDesc: 'Its last shift is over. Buy it and give it a life after coal: a museum, a park, a place to meet.',

const FACTS = {"landek": {"en": "Ice Age mammoth hunters burned coal on Landek hill in Ostrava. The finds from their hearths are considered the oldest known evidence of people using black coal.", "cs": "Lovci mamutů z doby ledové pálili uhlí na vrchu Landek v Ostravě. Nálezy z jejich ohnišť jsou považovány za nejstarší známý doklad toho, že lidé používali černé uhlí.", "pl": "Łowcy mamutów z epoki lodowcowej palili węgiel na wzgórzu Landek w Ostrawie. Znaleziska z ich palenisk uznaje się za najstarszy znany dowód używania węgla kamiennego przez ludzi."}, "ostrava-1763": {"en": "Ostrava's coal era began in 1763, when coal was found in the Burňa valley in today's Slezská Ostrava. Mining in the Ostrava-Karviná basin ended on 31 January 2026 at the ČSM mine in Stonava, more than 260 years later.", "cs": "Uhelná éra Ostravska začala v roce 1763 nálezem uhlí v údolí Burňa v dnešní Slezské Ostravě. Těžba v ostravsko-karvinském revíru skončila 31. 1. 2026 na Dole ČSM ve Stonavě, o více než 260 let později.", "pl": "Węglowa epoka Ostrawy zaczęła się w 1763 r., gdy znaleziono węgiel w dolinie Burňa w dzisiejszej Śląskiej Ostrawie. Wydobycie w zagłębiu ostrawsko-karwińskim zakończyło się 31.01.2026 w kopalni ČSM w Stonawie, ponad 260 lat później."}, "one-basin": {"en": "The Upper Silesian Coal Basin crosses the border. About five-sixths of it lies in Poland and one-sixth in Czechia, where it is called the Ostrava-Karviná basin.", "cs": "Hornoslezská uhelná pánev leží na obou stranách hranice. Asi pět šestin je v Polsku a jedna šestina v Česku, kde se jí říká ostravsko-karvinský revír.", "pl": "Górnośląskie Zagłębie Węglowe leży po obu stronach granicy. Ok. pięć szóstych znajduje się w Polsce, a jedna szósta w Czechach, gdzie nazywa się je zagłębiem ostrawsko-karwińskim."}, "greeting": {"en": "Miners greet each other with \"Zdař Bůh\" in Czech, \"Szczęść Boże\" in Polish and \"Glück auf\" in German. The German greeting wishes good luck, and is often read as a wish to come back up safely.", "cs": "Horníci se zdraví „Zdař Bůh“, polsky „Szczęść Boże“ a německy „Glück auf“. Německý pozdrav přeje štěstí a často se vykládá jako přání šťastného návratu nahoru.", "pl": "Górnicy pozdrawiają się „Szczęść Boże”, po czesku „Zdař Bůh”, a po niemiecku „Glück auf”. Niemieckie pozdrowienie życzy szczęścia i często rozumie się je jako życzenie bezpiecznego powrotu na powierzchnię."}, "barbara": {"en": "4 December, St Barbara's Day, is the miners' holiday: Barborka in Czechia, Barbórka in Poland. In Polish mining towns the day starts with a mass and a parade of miners' brass bands in dress uniforms with plumed hats.", "cs": "4. prosince, na svátek svaté Barbory, slaví horníci svůj den: v Česku Barborku, v Polsku Barbórku. V polských hornických městech začíná mší a průvodem hornických dechovek ve slavnostních uniformách s chocholy.", "pl": "4 grudnia, w dzień św. Barbary, górnicy obchodzą swoje święto: w Polsce Barbórkę, w Czechach Barborkę. W górniczych miastach dzień zaczyna się mszą i przemarszem orkiestr górniczych w galowych mundurach z czakami z pióropuszem."}, "chains": {"en": "In the miners' changing room, work clothes hung on hooks that were pulled up to the ceiling on chains to dry until the next shift. A chain room like this can still be seen at Michal Mine in Ostrava.", "cs": "V hornických šatnách visely pracovní oděvy na háčcích, které se na řetízcích vytahovaly ke stropu, aby do další směny uschly. Takovou řetízkovou šatnu dodnes uvidíte na Dole Michal v Ostravě.", "pl": "W górniczej łaźni ubrania robocze wisiały na hakach podciąganych na łańcuszkach pod sufit, gdzie schły do następnej zmiany. Taką łaźnię łańcuszkową można do dziś zobaczyć w kopalni Michal w Ostrawie."}, "michal": {"en": "Michal Mine in Ostrava closed in the early 1990s and was declared a national cultural monument in 1995. Visitors can walk the miners' route through the changing rooms, the lamp room and the machine hall.", "cs": "Důl Michal v Ostravě skončil na začátku 90. let a v roce 1995 byl prohlášen národní kulturní památkou. Návštěvníci mohou projít cestu horníků přes šatny, lampovnu a strojovnu.", "pl": "Kopalnia Michal w Ostrawie zakończyła pracę na początku lat 90., a w 1995 r. ogłoszono ją narodowym zabytkiem kultury. Zwiedzający mogą przejść drogą górników przez łaźnię, lampownię i maszynownię."}, "nikiszowiec": {"en": "Nikiszowiec in Katowice was built from 1908 for the miners of the Giesche company: red-brick blocks around courtyards, with their own church. Since 2011 it has been one of Poland's Historic Monuments.", "cs": "Nikiszowiec v Katovicích vznikal od roku 1908 pro horníky firmy Giesche: bloky z červených cihel kolem dvorů s vlastním kostelem. Od roku 2011 patří mezi polské Historické památky (Pomnik historii).", "pl": "Nikiszowiec w Katowicach powstawał od 1908 r. dla górników spółki Giesche: bloki z czerwonej cegły wokół podwórek, z własnym kościołem. Od 2011 r. jest Pomnikiem Historii."}, "prezydent": {"en": "The Prezydent shaft headframe in Chorzów, built in 1933, is a 42-metre reinforced-concrete tower, one of the most modern in Europe at the time. Coal was mined there until 1993.", "cs": "Těžní věž jámy Prezydent v Chořově z roku 1933 je 42 metrů vysoká železobetonová stavba, ve své době jedna z nejmodernějších v Evropě. Uhlí se tu těžilo do roku 1993.", "pl": "Wieża wyciągowa szybu Prezydent w Chorzowie z 1933 r. to żelbetowa budowla o wysokości 42 m, w swoim czasie jedna z najnowocześniejszych w Europie. Węgiel wydobywano tu do 1993 r."}, "adit": {"en": "Under Zabrze and Chorzów runs a drainage adit over 14 km long, dug between 1799 and 1863, the longest in European coal mining. Today you can ride a boat through part of it at the Queen Louise Adit in Zabrze.", "cs": "Pod Zabrzem a Chořovem vede přes 14 km dlouhá odvodňovací štola, ražená v letech 1799–1863, nejdelší v evropském uhelném hornictví. Část z ní dnes můžete projet lodí ve štole Královna Luisa v Zabrze.", "pl": "Pod Zabrzem i Chorzowem biegnie ponad 14-kilometrowa sztolnia odwadniająca, drążona w latach 1799–1863, najdłuższa w europejskim górnictwie węglowym. Dziś jej część można przepłynąć łodzią w Sztolni Królowa Luiza w Zabrzu."}, "tarnowskie": {"en": "The historic lead-silver-zinc mine in Tarnowskie Góry and its underground water system have been on the UNESCO World Heritage List since 2017.", "cs": "Historický důl na olovo, stříbro a zinek v Tarnowských Horách a jeho podzemní vodní systém jsou od roku 2017 na Seznamu světového dědictví UNESCO.", "pl": "Zabytkowa kopalnia rud ołowiu, srebra i cynku w Tarnowskich Górach wraz z podziemnym systemem gospodarowania wodą jest od 2017 r. na Liście światowego dziedzictwa UNESCO."}, "carbide": {"en": "Carbide lamps made light from acetylene gas: water dripped onto calcium carbide. An open flame is dangerous in gassy coal mines, so miners there used enclosed safety lamps until electric cap lamps took over.", "cs": "Karbidové lampy svítily acetylenem: na karbid vápníku kapala voda. Otevřený plamen je v plynujících uhelných dolech nebezpečný, a tak se v nich používaly uzavřené bezpečnostní kahany, dokud je nenahradily elektrické svítilny na přilbě.", "pl": "Lampy karbidowe świeciły acetylenem: na karbid wapnia kapała woda. Otwarty płomień jest niebezpieczny w gazowych kopalniach węgla, dlatego używano tam zamkniętych lamp bezpieczeństwa, aż zastąpiły je elektryczne lampy nahełmne."}};

/* ---------- state ---------- */
const $ = id => document.getElementById(id);
const C = $('c'), ctx = C.getContext('2d');
ctx.imageSmoothingEnabled = false;

let S, P, grid, seen, dirtLine, parts = [], floats = [], snow = [];
let camY = 0, shake = 0, flash = 0, flashCol = '#fff', paused = true, started = false, clock = 0, hudT = 0, saveT = 0, bedT = 0;
const dirStack = [];
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

function freshSave(house) {
  return { house: house || L.defHouse, money: 0, total: 0, deepest: 0, ravens: 0, won: false, pass: { ex: [], food: [] }, passDone: false, lv: { pick: 0, pack: 0, sta: 0, lamp: 0, boots: 0 } };
}
function loadSave() { try { const j = JSON.parse(localStorage.getItem(SAVE_KEY)); if (j && j.lv) return Object.assign(freshSave(), j, { lv: Object.assign(freshSave().lv, j.lv) }); } catch (e) {} return null; }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} saveWorld(); }

/* The mine itself is saved too (what is dug stays dug, what was seen stays seen), with the miner's
   position and load. Otherwise leaving and coming back would refill the mine and carry you home for free. */
const b64 = a => btoa(String.fromCharCode.apply(null, a));
const unb64 = t => Uint8Array.from(atob(t), ch => ch.charCodeAt(0));
let savedP = null;
function saveWorld() {
  if (!grid || !P) return;
  if (!ride) savedP = { x: P.x, y: P.y, stamina: P.stamina, cargo: P.cargo };
  try { localStorage.setItem(WORLD_KEY, JSON.stringify({ v: 1, cols: COLS, rows: ROWS, g: b64(grid), s: b64(seen), d: dirtLine, p: savedP })); } catch (e) {}
}
function loadWorld() {
  try {
    const w = JSON.parse(localStorage.getItem(WORLD_KEY));
    if (!w || w.v !== 1 || w.cols !== COLS || w.rows !== ROWS) return false;
    const g = unb64(w.g), sn = unb64(w.s);
    if (g.length !== COLS * ROWS || sn.length !== COLS * ROWS) return false;
    grid = g; seen = sn; dirtLine = w.d; savedP = w.p || null;
    finishWorld();
    return true;
  } catch (e) { return false; }
}

const tier = k => UPS[k].tiers[S.lv[k]][1];
const power = () => tier('pick'), cap = () => tier('pack'), maxSta = () => tier('sta'), lampR = () => tier('lamp'), stepT = () => tier('boots');
const depthOf = r => Math.max(0, r - SURF + 1);
const fmt = n => L.money(Math.round(n));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = (c, r, k) => (((c * 73856093) ^ (r * 19349663) ^ (k * 83492791)) >>> 0) % 1000 / 1000;
const houseCol = () => { let h = 0; for (const ch of S.house) h = (h * 31 + ch.charCodeAt(0)) % 360; return `hsl(${h},55%,42%)`; };

/* ---------- world ---------- */
function genWorld() {
  grid = new Uint8Array(COLS * ROWS); seen = new Uint8Array(COLS * ROWS);
  dirtLine = [];
  for (let c = 0; c < COLS; c++) dirtLine[c] = 18 + Math.round(Math.sin(c * .8) * 2 + Math.random() * 3);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = r * COLS + c, d = depthOf(r);
    grid[i] = r < SURF ? AIR : r >= ROWS - 1 ? BEDROCK : d < dirtLine[c] ? DIRT : STONE;
  }
  const solid = i => grid[i] === DIRT || grid[i] === STONE;
  const cluster = (c, r, id, size) => {
    for (let k = 0; k < size; k++) {
      if (c >= 0 && c < COLS && r >= SURF && r < ROWS - 1 && solid(r * COLS + c)) grid[r * COLS + c] = id;
      const m = Math.floor(Math.random() * 4); c += [1, -1, 0, 0][m]; r += [0, 0, 1, -1][m];
    }
  };
  ORES.forEach((o, n) => {
    for (let r = SURF + o.min; r < Math.min(ROWS - 1, SURF + o.max); r++) for (let c = 0; c < COLS; c++)
      if (Math.random() < o.p) cluster(c, r, ORE0 + n, 1 + Math.floor(Math.random() * o.cl));
  });
  for (let r = SURF + 34; r < ROWS - 1; r++) for (let c = 0; c < COLS; c++) if (Math.random() < .016) cluster(c, r, LAVA, 1 + Math.floor(Math.random() * 3));
  for (let r = SURF + 8; r < ROWS - 1; r++) for (let c = 0; c < COLS; c++) if (Math.random() < .0045 && solid(r * COLS + c)) grid[r * COLS + c] = CHEST;
  for (let c = 0; c < COLS; c++) seen[SURF * COLS + c] = 1;
  savedP = null;
  finishWorld();
}
function finishWorld() {
  if (S && S.won) { cutShaft(); if (!visitors.length) makeVisitors(); } else visitors = [];
  snow = Array.from({ length: 36 }, () => ({ x: Math.random() * W, y: Math.random() * SURF * T, v: 8 + Math.random() * 14, s: 1 + Math.random() * 1.6, p: Math.random() * 6 }));
}
function resetPlayer(keepCargo) {
  P = { x: 8, y: 2, px: 8, py: 2, stamina: maxSta(), cd: 0, dig: null, face: 1, burn: 0, swing: 0, cargo: keepCargo || {} };
}
const cargoCount = () => Object.values(P.cargo).reduce((a, b) => a + b, 0);
const cargoValue = () => ORES.reduce((a, o) => a + (P.cargo[o.id] || 0) * o.val, 0);

/* ---------- audio ---------- */
let ac = null, muted = false;
try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}
function audioInit() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
function tone(f, d, type = 'square', v = .04, slide = 0, delay = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
}
const sfx = {
  dig: () => tone(90 + Math.random() * 40, .07, 'square', .05, -30),
  ore: () => { tone(660, .09, 'triangle', .06); tone(990, .12, 'triangle', .05, 0, .07); },
  sell: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .14, 'triangle', .06, 0, i * .07)),
  buy: () => { tone(440, .1, 'triangle', .06); tone(880, .18, 'triangle', .06, 0, .09); },
  burn: () => tone(220, .35, 'sawtooth', .07, -150),
  fall: () => tone(300, .5, 'sawtooth', .06, -240),
  raven: () => { tone(900, .12, 'triangle', .05, 300); tone(700, .12, 'triangle', .05, 300, .12); },
  nope: () => tone(120, .12, 'square', .05),
};
function syncMute() { $('mute').textContent = muted ? L.soundOff : L.soundOn; }

/* ---------- feedback ---------- */
let toastTimer = 0;
function say(text, kind) {
  const t = $('toast'); t.textContent = text; t.className = 'toast on ' + (kind || '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}
function burst(x, y, col, n, spd = 70) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = (.3 + Math.random()) * spd; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, life: .45 + Math.random() * .3, col }); }
}
function floatText(x, y, text, col) { floats.push({ x, y, text, col, life: 1.1 }); }

/* ---------- actions ---------- */
const LAVA_LIMIT = .9;   // seconds of pushing into lava before it burns you
const hardness = (id, r) => {
  if (id === LAVA) return LAVA_LIMIT;
  const d = depthOf(r);
  if (id === DIRT) return .25 + d * .002;
  if (id === STONE) return .5 + d * .006;
  if (id === CHEST) return .4;
  return ORES[id - ORE0].h;
};
function reveal() {
  const R = lampR(), r0 = Math.max(SURF, Math.floor(P.py - R)), r1 = Math.min(ROWS - 1, Math.ceil(P.py + R));
  for (let r = r0; r <= r1; r++) for (let c = Math.max(0, Math.floor(P.px - R)); c <= Math.min(COLS - 1, Math.ceil(P.px + R)); c++)
    if (Math.hypot(c - P.px, r - P.py) <= R) seen[r * COLS + c] = 1;
}
function finishDig(tx, ty, id) {
  const i = ty * COLS + tx, h = hardness(id, ty);
  grid[i] = AIR;
  P.stamina -= .5 + h * .35;
  const cx = tx * T + T / 2, cy = ty * T + T / 2;
  if (id >= ORE0) {
    const o = ORES[id - ORE0];
    if (cargoCount() < cap()) { P.cargo[o.id] = (P.cargo[o.id] || 0) + 1; floatText(cx, cy, '+1 ' + o.name, o.hi); sfx.ore(); }
    else { floatText(cx, cy, L.packFull, '#ff9b7f'); sfx.nope(); }
    burst(cx, cy, o.col, 9, 90);
  } else if (id === CHEST) {
    const win = Math.round((40 + depthOf(ty) * 4) * (.6 + Math.random() * .9));
    S.money += win; S.total += win; save();
    floatText(cx, cy, L.chest + fmt(win), '#ffe08a'); say(L.gift(fmt(win)), 'good'); sfx.sell();
    burst(cx, cy, '#e8bf50', 16, 110);
  } else {
    burst(cx, cy, id === DIRT ? '#6b4a30' : '#6e655d', 6); sfx.dig();
  }
  if (P.stamina <= 0) collapse();
}
function collapse() {
  const lost = cargoCount();
  P.cargo = {};
  P.y = 2; P.py = 2; P.dig = null; P.stamina = maxSta(); camY = 0;
  flash = .8; flashCol = '#000'; sfx.fall();
  say(L.collapsed(lost), 'bad');
}
function sendRaven() {
  if (paused) return;
  if (ride) return;
  if (inMuseum()) return say(L.useLift);
  if (P.y <= 2) return say(L.home);
  if (S.ravens < 1) { sfx.nope(); return say(L.noRides, 'bad'); }
  S.ravens--; save(); P.y = 2; P.py = 2; P.dig = null; sfx.raven();
  say(L.rideHome, 'good');
}
function burn() {
  P.burn = .7; P.stamina -= 25; shake = .35; flash = .5; flashCol = '#e0501a'; sfx.burn();
  floatText(P.x * T + T / 2, P.y * T, L.fire, '#ff8a5a');
  say(L.fireHint, 'bad');
  if (P.stamina <= 0) collapse();
}

function update(dt) {
  P.cd -= dt; P.burn -= dt; bedT -= dt;
  const k = 1 - Math.exp(-dt * 22);
  P.px += (P.x - P.px) * k; P.py += (P.y - P.py) * k;
  reveal();
  if (inMuseum()) { P.dig = null; updateMuseum(); return; }
  if (P.y <= 2 && P.stamina < maxSta()) P.stamina = Math.min(maxSta(), P.stamina + dt * 90);
  if (P.y > 2) { P.stamina -= dt * .6; if (P.stamina <= 0) { collapse(); return; } }
  const d = dirStack[dirStack.length - 1];
  if (!d) { P.dig = null; P.swing = 0; return; }
  const [dx, dy] = DIRS[d]; P.dir = d; if (dx) P.face = dx;
  const tx = P.x + dx, ty = P.y + dy;
  if (tx < 0 || tx >= COLS || ty < 2 || ty >= ROWS || P.burn > 0) { P.dig = null; return; }
  const id = grid[ty * COLS + tx];
  if (id === AIR) {
    P.dig = null;
    if (P.cd <= 0) {
      P.x = tx; P.y = ty; P.cd = stepT();
      S.deepest = Math.max(S.deepest, depthOf(P.y));
      if (P.stamina <= 0) collapse();
    }
    return;
  }
  if (id === LAVA) {
    if (!P.dig || P.dig.x !== tx || P.dig.y !== ty) P.dig = { x: tx, y: ty, prog: 0, chip: 0 };
    P.dig.prog += dt; P.dig.chip += dt;
    if (P.dig.chip > .12) { P.dig.chip = 0; burst(tx * T + T / 2, ty * T + T / 2, '#ff8a3a', 2, 40); tone(180 + Math.random() * 60, .05, 'sawtooth', .02); }
    if (P.dig.prog >= LAVA_LIMIT) { P.dig = null; burn(); }
    return;
  }
  if (id === BEDROCK) { if (bedT <= 0) { say(L.bedrock); bedT = 2; } return; }
  if (id === SHAFT) { P.dig = null; return; }
  if (!P.dig || P.dig.x !== tx || P.dig.y !== ty) P.dig = { x: tx, y: ty, prog: 0, chip: 0 };
  const need = hardness(id, ty);
  P.dig.prog += dt * power(); P.dig.chip += dt; P.swing += dt;
  if (P.dig.chip > .09) { P.dig.chip = 0; burst(tx * T + T / 2, ty * T + T / 2, id === DIRT ? '#6b4a30' : '#6e655d', 2, 50); if (id < ORE0) tone(110 + Math.random() * 30, .04, 'square', .025); }
  if (P.dig.prog >= need) { finishDig(tx, ty, id); P.dig = null; P.cd = .03; }
}

/* ---------- shop ---------- */
const nearShop = () => started && !ride && P.y <= 2 && P.x >= 11 && P.x <= 14;
function openShop() {
  if (!nearShop() || paused) return;
  paused = true; dirStack.length = 0; renderShop(); $('shop').hidden = false; $('prompt').hidden = true;
}
function closeShop() { $('shop').hidden = true; paused = false; save(); }
function renderShop() {
  const cv = cargoValue();
  let h = `<div class="shop"><div class="shop-head"><h2>${L.hall}</h2><div class="cash">${fmt(S.money)}</div></div>`;

const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Enter') $('begin').click(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key in KEYMAP) { e.preventDefault(); audioInit(); if (!paused) press(KEYMAP[e.key]); return; }
  const k = e.key.toLowerCase();

  else if (k === 'escape') {

/* ---------- museum ----------
   Buying the old mine turns column 0 into a shaft with a cage. The cage goes down past the bedrock into a
   museum hall: 12 exhibits with the site's mining facts, a café with local food, visitors walking around.
   Seeing every exhibit and tasting every dish fills the passport, which ends with a link to the site's /check. */
const MUS_TOP = ROWS, MUS_ROW = ROWS + 3, WORLD_ROWS = ROWS + 5;   // hall rows ROWS..ROWS+3, floor below
const EX0 = 3, CAFE_X = 15, FOOD_PRICES = [35, 25, 20, 15];        // exhibits in columns 3-14, café in 15
const PASS_TOTAL = FACT_IDS.length + FOOD_PRICES.length;
let ride = null, visitors = [], talkT = 3, promptKey = '';
const inMuseum = () => P.y >= ROWS;
const nearLift = () => started && !ride && P.x <= 1 && (P.y <= 2 || inMuseum());
const exhibitAt = () => inMuseum() && P.x >= EX0 && P.x < EX0 + FACT_IDS.length ? P.x - EX0 : -1;
const nearCafe = () => inMuseum() && P.x === CAFE_X;
const passCount = () => S.pass.ex.length + S.pass.food.length;

function cutShaft() { for (let r = SURF; r < ROWS; r++) { grid[r * COLS] = SHAFT; seen[r * COLS] = 1; } }

function interact() {
  if (!started || paused || ride) return;
  if (nearShop()) return openShop();
  if (nearLift()) {
    if (!S.won) { sfx.nope(); return say(L.liftLocked, 'bad'); }
    return startRide(!inMuseum());
  }
  const ex = exhibitAt();
  if (ex >= 0) return openExhibit(ex);
  if (nearCafe()) return openCafe();
  if (!inMuseum()) say(L.hallWhere);
}
function promptHtml() {
  if (!started || paused || ride) return '';
  const k = '<kbd>E</kbd>';
  if (nearShop()) return k + L.enterHall;
  if (nearLift()) return k + (!S.won ? L.raven : inMuseum() ? L.liftUp : L.liftDown);
  const ex = exhibitAt();
  if (ex >= 0) return k + L.exNames[ex] + (S.pass.ex.includes(FACT_IDS[ex]) ? ' ✓' : '');
  if (nearCafe()) return k + L.cafe;
  return '';
}

/* the cage ride */
function startRide(down) {
  dirStack.length = 0; P.dig = null; P.x = 0; P.px = 0; P.face = 1;
  ride = { from: P.py, to: down ? MUS_ROW : 2, t: 0, dur: 3.4, down };
  sfx.bell(); tone(52, ride.dur, 'sawtooth', .02);
}
function updateRide(dt) {
  ride.t += dt;
  const k = clamp(ride.t / ride.dur, 0, 1), e = k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
  P.py = ride.from + (ride.to - ride.from) * e; P.y = Math.round(P.py);
  if (k < 1) return;
  const down = ride.down; ride = null;
  P.y = P.py = down ? MUS_ROW : 2; P.x = 1; P.cd = .25; P.stamina = maxSta();
  tone(1320, .6, 'triangle', .05);
  if (down) say(L.museumHello, 'good');
}
function updateMuseum() {
  P.stamina = maxSta();
  const d = dirStack[dirStack.length - 1];
  if (!d || P.cd > 0) return;
  const dx = DIRS[d][0]; if (!dx) return;
  P.face = dx; P.dir = d;
  if (P.x + dx >= 1 && P.x + dx < COLS) { P.x += dx; P.cd = stepT(); }
}

/* exhibits, café and the passport (all in the #info overlay) */
function openInfo(html) { paused = true; dirStack.length = 0; $('info').innerHTML = html; $('info').hidden = false; $('prompt').hidden = true; }
function closeInfo() { $('info').hidden = true; paused = false; save(); maybePassDone(); }
function addStamp(kind, id) { if (S.pass[kind].includes(id)) return false; S.pass[kind].push(id); save(); return true; }
function openExhibit(i) {
  const id = FACT_IDS[i], isNew = addStamp('ex', id);
  if (isNew) sfx.buy();
  openInfo(`<div class="card"><div class="tag">${L.exhibitTag(i + 1, FACT_IDS.length)}</div><h2>${L.exNames[i]}</h2><p>${esc(FACTS[id][LANG])}</p>` +
    `<p class="pass">${isNew ? '✓ ' : ''}${L.pass}: ${passCount()}/${PASS_TOTAL}</p><div class="row"><button class="btn" data-close>${L.close}</button></div></div>`);
}
function openCafe() {
  let h = `<div class="shop"><div class="shop-head"><h2>${L.cafe}</h2><div class="cash">${fmt(S.money)}</div></div><div class="sect">${L.cafeSub}</div>`;
  L.foods.forEach((f, i) => {
    h += `<div class="up"><div><b>${f}</b>${S.pass.food.includes(i) ? ' ✓' : ''}</div><div class="d">${L.foodDesc[i]}</div>` +
      `<button class="btn" data-eat="${i}" ${S.money >= FOOD_PRICES[i] ? '' : 'disabled'}>${fmt(FOOD_PRICES[i])}</button></div>`;
  });
  h += `<p class="pass">${L.pass}: ${passCount()}/${PASS_TOTAL}</p><div class="row"><button class="btn ghost" data-close>${L.close}</button></div></div>`;
  openInfo(h);
}
function eat(i) {
  if (S.money < FOOD_PRICES[i]) return;
  S.money -= FOOD_PRICES[i];
  const isNew = addStamp('food', i);
  $('info').hidden = true; paused = false; save();
  sfx.eat(); floatText(P.x * T + T / 2, P.y * T, L.yum, '#ffe08a'); burst(P.x * T + T / 2, P.y * T + 14, '#d9a066', 8, 40);
  say(L.ate(L.foods[i]) + (isNew ? ' ' + L.stamp(passCount(), PASS_TOTAL) : ''), 'good');
  setTimeout(maybePassDone, 1600);
}
function maybePassDone() {
  if (S.passDone || passCount() < PASS_TOTAL || paused) return;
  S.passDone = true; save(); sfx.sell();
  openInfo(`<div class="card"><div class="tag">${L.passTag}</div><h2>${L.passH}</h2><p>${L.passP}</p>` +
    `<div class="row"><button class="btn" data-check>${L.passBtn}</button><button class="btn ghost" data-close>${L.passStay}</button></div></div>`);
}
function goCheck() {
  save();
  if (parent !== window) parent.postMessage({ lacGame: 'goto', path: '/check' }, location.origin);
  else location.href = '../check';
}
$('info').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.hasAttribute('data-close')) closeInfo();
  else if (b.dataset.eat !== undefined) eat(+b.dataset.eat);
  else if (b.hasAttribute('data-check')) goCheck();
});

/* visitors: they walk, stop at exhibits and sometimes say something. You cannot talk to them. */
function makeVisitors() {
  const kinds = ['adult', 'kid', 'guide', 'adult', 'kid', 'adult'], shirts = ['#3a6ea5', '#c98a2b', '#15171c', '#9c3d54', '#7a8f3a', '#2f7f7a'];
  visitors = kinds.map((kind, n) => ({ kind, shirt: shirts[n], x: 2.5 + n * 2.1, to: 2 + Math.random() * 12.5, v: kind === 'kid' ? 1.3 : .6 + Math.random() * .4, wait: Math.random() * 3, step: 0, say: '', sayT: 0 }));
}
function updateVisitors(dt) {
  for (const v of visitors) {
    if (v.sayT > 0) v.sayT -= dt;
    if (v.wait > 0) { v.wait -= dt; continue; }
    const d = v.to - v.x;
    if (Math.abs(d) < .05) { v.wait = 1.5 + Math.random() * 4; v.to = 2 + Math.random() * 12.5; continue; }
    v.x += Math.sign(d) * Math.min(Math.abs(d), v.v * dt); v.step += dt;
  }
  if (!inMuseum() || !visitors.length) return;
  talkT -= dt;
  if (talkT > 0) return;
  talkT = 3.5 + Math.random() * 4;
  const v = visitors[Math.floor(Math.random() * visitors.length)];
  const pool = v.kind === 'kid' ? L.kidLines : v.kind === 'guide' ? L.guideLines : L.adultLines;
  v.say = pool[Math.floor(Math.random() * pool.length)]; v.sayT = 3.2;
}

/* drawing */
const RR = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function board(cx, y, text, w) {
  ctx.font = '700 10px Oswald, "Arial Narrow", sans-serif'; ctx.textAlign = 'center';
  const bw = w || ctx.measureText(text).width + 12;
  RR(cx - bw / 2, y, bw, 15, '#5a3b22'); RR(cx - bw / 2, y, bw, 2, '#7a5230');
  ctx.fillStyle = '#e8bf50'; ctx.fillText(text, cx, y + 11.5, bw - 4);
}
function frameBoard(x, y) { RR(x + 2, y, 36, 30, '#7a5a30'); RR(x + 4, y + 2, 32, 26, '#221c17'); }
function drawExhibit(i, x, yF) {
  const top = yF - 4 * T;
  const plinth = () => { RR(x + 8, yF - 14, 24, 14, '#6b5a4a'); RR(x + 8, yF - 14, 24, 2, '#8a7562'); };
  switch (i) {
    case 0: // mammoth tusk
      plinth(); ctx.strokeStyle = '#efe4cc'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(x + 26, yF - 16, 15, Math.PI * 1.05, Math.PI * 1.72); ctx.stroke(); break;
    case 1: // 1763-2026 board
      frameBoard(x, top + 40); ctx.font = '700 9px Oswald, sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = '#e8bf50'; ctx.fillText('1763', x + 20, top + 53); ctx.fillStyle = '#c9b8a2'; ctx.fillText('2026', x + 20, top + 65); break;
    case 2: // one basin: PL 5/6, CZ 1/6
      frameBoard(x, top + 40); RR(x + 6, top + 46, 23, 18, '#c9492f'); RR(x + 29, top + 46, 5, 18, '#3a6ea5');
      ctx.font = '700 7px Oswald, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText('PL', x + 17, top + 58); break;
    case 3: // greeting banner with hammer and pick
      RR(x + 19, top + 8, 2, 30, '#14100d'); RR(x + 7, top + 36, 26, 40, '#1d4d2b'); RR(x + 7, top + 74, 26, 3, '#e8bf50');
      ctx.font = '18px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#e8bf50'; ctx.fillText('⚒', x + 20, top + 62); break;
    case 4: // St Barbara with her tower
      RR(x + 6, yF - 14, 28, 14, '#7a6c5e');
      ctx.fillStyle = '#d9cfc0'; ctx.beginPath(); ctx.moveTo(x + 18, yF - 50); ctx.lineTo(x + 9, yF - 14); ctx.lineTo(x + 27, yF - 14); ctx.closePath(); ctx.fill();
      RR(x + 15, yF - 58, 7, 8, '#e8dccf'); RR(x + 14, yF - 61, 9, 3, '#e8bf50'); RR(x + 28, yF - 40, 6, 26, '#a89c8d'); RR(x + 27, yF - 43, 8, 3, '#8a7f72'); break;
    case 5: // chain changing room: clothes pulled up to the ceiling
      for (let k = 0; k < 3; k++) {
        const hx = x + 8 + k * 12, hy = top + 34 + k * 8 + Math.sin(clock * 1.5 + k) * 1.5;
        RR(hx, top + 6, 1, hy - top - 6, '#9aa3ad'); RR(hx - 5, hy, 11, 13, ['#2f4a6e', '#5d5a52', '#7a3a2a'][k]); RR(hx - 6, hy, 13, 3, '#14100d');
      } break;
    case 6: // Michal Mine lamp room
      RR(x + 3, top + 52, 34, 3, '#6a4424'); RR(x + 3, top + 76, 34, 3, '#6a4424');
      for (let k = 0; k < 4; k++) { RR(x + 6 + k * 8, top + 42, 5, 10, '#3d4552'); RR(x + 6 + k * 8, top + 42, 5, 2, '#ffd27a'); RR(x + 6 + k * 8, top + 66, 5, 10, '#3d4552'); RR(x + 6 + k * 8, top + 66, 5, 2, '#ffd27a'); } break;
    case 7: // Nikiszowiec red-brick model
      RR(x + 4, yF - 22, 32, 4, '#6a4424'); RR(x + 6, yF - 18, 3, 18, '#4a3020'); RR(x + 31, yF - 18, 3, 18, '#4a3020');
      RR(x + 7, yF - 42, 26, 20, '#a9472f'); RR(x + 5, yF - 46, 30, 4, '#7a2f20');
      for (let k = 0; k < 3; k++) { RR(x + 10 + k * 8, yF - 38, 4, 5, '#ffe0a0'); RR(x + 10 + k * 8, yF - 30, 4, 5, '#ffe0a0'); } break;
    case 8: // Prezydent concrete headframe model
      plinth(); RR(x + 13, yF - 92, 14, 78, '#b8b2a8');
      for (let y = yF - 86; y < yF - 20; y += 10) RR(x + 16, y, 8, 3, '#7d776e');
      ctx.strokeStyle = '#5a5650'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + 20, yF - 96, 5, 0, 6.283); ctx.stroke(); break;
    case 9: // drainage adit with a boat
      frameBoard(x, top + 40); ctx.fillStyle = '#0c0a09'; ctx.beginPath(); ctx.arc(x + 20, top + 58, 11, Math.PI, 0); ctx.fill(); RR(x + 9, top + 58, 22, 8, '#0c0a09');
      RR(x + 9, top + 62, 22, 4, '#3a6ea5'); RR(x + 15, top + 59, 10, 3, '#8f5a2a'); break;
    case 10: // Tarnowskie Góry silver ore in a case
      RR(x + 10, yF - 18, 20, 18, '#6b5a4a'); RR(x + 8, yF - 42, 24, 24, 'rgba(160,210,235,.16)');
      ctx.strokeStyle = 'rgba(200,230,245,.5)'; ctx.lineWidth = 1; ctx.strokeRect(x + 8.5, yF - 41.5, 23, 23);
      RR(x + 13, yF - 28, 14, 9, '#7d858c'); RR(x + 15, yF - 27, 5, 3, '#e6edf2'); RR(x + 21, yF - 24, 4, 3, '#cfd8e0');
      RR(x + 11, yF - 54, 18, 8, '#2a5d9c'); ctx.font = '700 6px Oswald, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText('UNESCO', x + 20, yF - 48); break;
    case 11: { // carbide lamp with a flickering flame
      plinth(); RR(x + 14, yF - 36, 12, 22, '#c8a24a'); RR(x + 14, yF - 36, 12, 3, '#e8c870'); RR(x + 11, yF - 40, 18, 4, '#9a7a30');
      const f = Math.sin(clock * 14) * 1.5;
      RR(x + 18, yF - 48 - f, 4, 8 + f, '#ffd27a'); RR(x + 19, yF - 45, 2, 5, '#fff3c4'); break;
    }
  }
}
function drawCafe(x, yF) {
  const top = yF - 4 * T;
  RR(x + 4, top + 54, 32, 26, '#1f2a22'); ctx.fillStyle = '#d8e0d0'; for (let k = 0; k < 4; k++) ctx.fillRect(x + 8, top + 60 + k * 5, 14 + (k % 2) * 8, 2);
  RR(x, yF - 28, 40, 4, '#8f5a2a'); RR(x + 2, yF - 24, 36, 24, '#6a3f1d');
  RR(x + 22, yF - 44, 12, 16, '#9aa3ad'); RR(x + 24, yF - 40, 8, 3, '#3d4552');
  RR(x + 6, yF - 34, 6, 6, '#efe6d8');
  ctx.globalAlpha = .5; RR(x + 8 + Math.sin(clock * 3) * 1.5, yF - 42, 2, 6, '#efe6d8'); ctx.globalAlpha = 1;
}
function bubble(text, x, y) {
  ctx.font = '600 13px Inter, system-ui, sans-serif'; ctx.textAlign = 'left';
  const w = ctx.measureText(text).width + 12, bx = clamp(x - w / 2, 4, W - w - 4);
  ctx.globalAlpha = .95; RR(bx, y - 22, w, 19, '#efe6d8');
  ctx.beginPath(); ctx.moveTo(x - 4, y - 3); ctx.lineTo(x + 4, y - 3); ctx.lineTo(x, y + 2); ctx.fill();
  ctx.fillStyle = '#1a140f'; ctx.fillText(text, bx + 6, y - 8); ctx.globalAlpha = 1;
}
function drawPerson(v, yF) {
  const kid = v.kind === 'kid', guide = v.kind === 'guide', walking = v.wait <= 0;
  const h = kid ? 24 : 34, x = Math.round(v.x * T + T / 2), lg = walking ? Math.round(Math.sin(v.step * 12) * 2) : 0;
  const top = yF - h - (walking ? Math.abs(lg) * .5 : 0), legH = kid ? 8 : 12;
  RR(x - 5 + lg, yF - legH, 4, legH, '#241912'); RR(x + 1 - lg, yF - legH, 4, legH, '#241912');
  RR(x - 6, top + (kid ? 8 : 10), 12, kid ? 9 : 13, v.shirt);
  RR(x - 4, top + (kid ? 1 : 2), 8, kid ? 7 : 8, '#e0b48a');
  if (kid) RR(x - 5, top - 1, 10, 4, '#f2c230');
  else if (guide) { RR(x - 4, top - 4, 8, 6, '#0d0d10'); RR(x - 1, top - 11, 3, 8, '#e9eef2'); RR(x - 1, top + 13, 2, 2, '#e8bf50'); RR(x - 1, top + 17, 2, 2, '#e8bf50'); }
  else RR(x - 4, top, 8, 3, '#4a3a2e');
  if (v.sayT > 0 && v.say) bubble(v.say, x, top - (guide ? 14 : 6));
}
function drawMuseum() {
  const y0 = MUS_TOP * T, yF = (MUS_ROW + 1) * T;
  // rock above the hall, with the shaft going up (plain stone: it does not give away ore)
  for (let r = Math.max(SURF, Math.floor(camY / T)); r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const sx = c * T, sy = r * T;
    drawTile(c === 0 ? SHAFT : r === ROWS - 1 ? BEDROCK : STONE, c, r, sx, sy);
    RR(sx, sy, T, T, `rgba(6,5,4,${.35 + (ROWS - r) * .07})`);
  }
  RR(0, y0, W, yF - y0, '#2e241d'); RR(0, yF - 46, W, 46, '#3a2d24'); RR(0, yF - 48, W, 3, '#4b3a2e');
  RR(0, y0, W, 8, '#1c1612'); for (let x = 46; x < W; x += 80) RR(x, y0, 6, 22, '#1c1612');
  RR(0, yF, W, T, '#5b4636'); for (let x = 0; x < W; x += 20) RR(x, yF, 2, T, '#4a3a2e'); RR(0, yF, W, 3, '#7a604a');
  RR(0, yF + T, W, T, '#0b0908');
  // the shaft comes down at the left edge
  RR(0, y0, T, yF - y0, '#0c0a09'); RR(2, y0, 3, yF - y0, '#4a4038'); RR(T - 5, y0, 3, yF - y0, '#4a4038');
  for (let c = 2; c < COLS; c += 2) {
    const lx = c * T + 20, g = ctx.createRadialGradient(lx, y0 + 22, 2, lx, y0 + 22, 95);
    g.addColorStop(0, 'rgba(255,200,120,.2)'); g.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = g; ctx.fillRect(lx - 95, y0, 190, yF - y0);
    RR(lx - 1, y0 + 8, 2, 9, '#14100d'); RR(lx - 4, y0 + 17, 8, 5, '#ffd27a');
  }
  board(2 * T + 20, y0 + 30, L.museumSign);
  board(CAFE_X * T + 20, y0 + 30, L.cafeSign, 38);
  FACT_IDS.forEach((id, i) => {
    const c = EX0 + i; drawExhibit(i, c * T, yF);
    if (S.pass.ex.includes(id)) RR(c * T + 14, yF + 8, 12, 3, '#7cc27f');
  });
  drawCafe(CAFE_X * T, yF);
  for (const v of visitors) drawPerson(v, yF);
}
function drawCage(cy) {
  RR(19, 34, 2, Math.max(0, cy - 34), '#8a8f98');
  RR(2, cy, 36, 4, '#3d4552'); RR(2, cy + T - 4, 36, 4, '#3d4552'); RR(2, cy, 3, T, '#3d4552'); RR(35, cy, 3, T, '#3d4552');
  ctx.globalAlpha = .55; for (let x = 9; x < 35; x += 7) RR(x, cy + 4, 2, T - 8, '#a0aab4'); ctx.globalAlpha = 1;
  RR(17, cy + 5, 6, 3, '#ffd27a');
}
function passBadge() {
  const t = L.pass + ' ' + passCount() + '/' + PASS_TOTAL;
  ctx.font = '700 14px Oswald, "Arial Narrow", sans-serif'; ctx.textAlign = 'left';
  const w = ctx.measureText(t).width + 18;
  RR(8, 8, w, 24, 'rgba(18,15,13,.85)'); RR(8, 8, 4, 24, '#e8bf50');
  ctx.fillStyle = '#e8bf50'; ctx.fillText(t, 18, 25);
}

/* ---------- HUD ---------- */
function hud() {
  const d = depthOf(P.y), n = cargoCount(), c = cap(), ms = maxSta();
  $('depth').textContent = d; $('best').textContent = S.deepest;
  $('cash').textContent = fmt(S.money); $('pack').textContent = n; $('cap').textContent = c;
  $('packbar').firstElementChild.style.width = (n / c * 100) + '%'; $('packbar').classList.toggle('full', n >= c);
  $('sta').textContent = Math.max(0, Math.ceil(P.stamina)); $('stamax').textContent = ms;
  $('stabar').firstElementChild.style.width = clamp(P.stamina / ms * 100, 0, 100) + '%'; $('stabar').classList.toggle('warn', P.stamina < ms * .25);
  $('ravens').textContent = S.ravens;
  let rank = RANKS[0][1]; for (const [t, n2] of RANKS) if (S.total >= t) rank = n2;
  $('rank').textContent = S.house + ' · ' + rank;
  const ph = promptHtml();
  if (ph !== promptKey) { promptKey = ph; $('prompt').innerHTML = ph; }
  $('prompt').hidden = !ph;
  $('prompt').classList.toggle('raised', inMuseum());
}

/* ---------- loop & start ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (ride) updateRide(dt); else if (started && !paused) update(dt);
  if (S && S.won) updateVisitors(dt);
  if (S) { render(dt); hudT += dt; saveT += dt; if (hudT > .05) { hudT = 0; hud(); } if (saveT > 8 && started) { saveT = 0; save(); } }
  requestAnimationFrame(frame);
}

function boot() {
  syncMute();
  const saved = loadSave();
  S = saved || freshSave();
  if (!saved || !loadWorld()) genWorld();
  resetPlayer();
  if (savedP) { Object.assign(P, { x: savedP.x, y: savedP.y, px: savedP.x, py: savedP.y, stamina: savedP.stamina, cargo: savedP.cargo || {} }); camY = Math.max(0, P.py * T + T / 2 - H / 2); }
  $('house').value = S.house;
  if (saved && (saved.total > 0 || saved.deepest > 0)) { $('begin').textContent = L.cont(S.house); $('erase').hidden = false; }
  hud();
  requestAnimationFrame(frame);
}
$('begin').onclick = () => {
  audioInit();
  const name = ($('house').value || '').trim().slice(0, 18) || L.defHouse;
  S.house = name; save();
  $('start').hidden = true; started = true; paused = false;
  if (P.y <= 2) say(L.hint);
};
let eraseArm = false;
$('erase').onclick = () => {
  if (!eraseArm) { eraseArm = true; $('erase').textContent = L.again; return; }
  S = freshSave($('house').value.trim()); genWorld(); resetPlayer(); save();
  $('begin').textContent = L.begin; $('erase').hidden = true; $('erase').textContent = L.erase; eraseArm = false; hud();
};
// Closing the overlay on the site removes this page: keep the latest progress.
addEventListener('pagehide', () => { if (started) save(); });
let rsArm = 0;
$('restart').onclick = () => {
  const b = $('restart');
  if (!rsArm) { rsArm = setTimeout(() => { rsArm = 0; b.textContent = L.restart; }, 3000); b.textContent = L.again; return; }
  clearTimeout(rsArm); rsArm = 0; b.textContent = L.restart;
  dirStack.length = 0; parts = []; floats = [];
  S = freshSave(S.house); genWorld(); resetPlayer(); save(); camY = 0;
  started = false; paused = true;
  $('shop').hidden = true; $('end').hidden = true; $('start').hidden = false;
  $('begin').textContent = L.begin; $('erase').hidden = true; $('house').value = S.house;
  hud();
};
boot();
})();
</script>
